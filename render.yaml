services:
  - type: web
    name: imsanghaar-word-mcp
    runtime: python
    buildCommand: pip install .
    startCommand: word_mcp_server
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PATH
        value: /mcp
      - key: FASTMCP_LOG_LEVEL
        value: INFO
