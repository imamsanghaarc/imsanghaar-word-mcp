services:
  - type: web
    name: imsanghaar-word-mcp
    runtime: python
    buildCommand: pip install .
    startCommand: word_mcp_server
    # NOTE (v1.2.0+): browser sign-in (sanglabs.vercel.app/mcp/signup) only
    # works on the local stdio transport. This hosted deployment rejects tool
    # calls with an explanatory message until hosted OAuth is implemented.
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PATH
        value: /mcp
      - key: FASTMCP_LOG_LEVEL
        value: INFO
